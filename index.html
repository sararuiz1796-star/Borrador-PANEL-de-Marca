<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#050403">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<title>VintageCam · Filtros Retro</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%B7%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{height:100%;background:#050403}
body{font-family:'Space Grotesk',sans-serif;overscroll-behavior:none}
button{font-family:inherit;}
.hidden{display:none !important}

#app{
  position:relative;
  height:100dvh;width:100vw;
  max-width:560px;margin:0 auto;
  background:#050403;color:#F5F0E8;
  overflow:hidden;
}

/* ── SCREENS ── */
.screen{
  position:absolute;inset:0;
  display:flex;flex-direction:column;
  opacity:0;pointer-events:none;
  transition:opacity .22s ease;
}
.screen.active{opacity:1;pointer-events:auto}

/* ── CAMERA / VIEWFINDER ── */
.viewfinder{position:relative;flex:1;overflow:hidden;background:#0A0806;min-height:0}
#canvas{width:100%;height:100%;display:block}
#video{display:none}

.flash-layer{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:6}
.flash-layer.pop{opacity:.9;transition:opacity .02s linear}
.flash-layer.fade{opacity:0;transition:opacity .28s ease}

.top-controls{
  position:absolute;top:0;left:0;right:0;z-index:5;
  display:flex;align-items:center;justify-content:space-between;
  padding:calc(env(safe-area-inset-top,0px) + 14px) 14px 0;
}
.tc-group{display:flex;gap:8px}
.icon-btn{
  width:38px;height:38px;border-radius:50%;
  background:rgba(5,4,3,.4);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  border:1px solid rgba(245,240,232,.16);color:#F5F0E8;
  font-size:15px;display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:transform .15s, background .15s;
}
.icon-btn:active{transform:scale(.9)}
.icon-btn.active-state{background:rgba(232,168,87,.35);border-color:rgba(232,168,87,.6)}
.icon-btn.shake{animation:shake .35s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}

.filter-name-badge{
  font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.16em;text-transform:uppercase;
  color:#E8A857;background:rgba(5,4,3,.4);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  padding:8px 16px;border-radius:99px;border:1px solid rgba(232,168,87,.3);
  pointer-events:none;
}

.import-badge{
  position:absolute;top:66px;left:0;right:0;z-index:5;
  display:flex;justify-content:center;
}
.import-badge-inner{
  display:flex;align-items:center;gap:8px;
  background:rgba(122,155,181,.25);border:1px solid rgba(122,155,181,.5);
  color:#BFD6E6;font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.12em;text-transform:uppercase;
  padding:6px 8px 6px 12px;border-radius:99px;backdrop-filter:blur(8px);
}
.import-badge-inner button{
  width:20px;height:20px;border-radius:50%;border:none;background:rgba(255,255,255,.15);color:#fff;
  font-size:11px;cursor:pointer;
}

.permission-msg{
  position:absolute;inset:0;z-index:10;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
  padding:40px 32px;text-align:center;background:rgba(5,4,3,.96);
}
.pm-icon{font-size:38px}
.pm-title{font-size:16px;font-weight:600}
.pm-text{font-size:12.5px;color:rgba(245,240,232,.6);line-height:1.6;font-weight:400}
.pm-actions{display:flex;gap:10px;margin-top:6px;flex-wrap:wrap;justify-content:center}
.pm-btn{
  font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  padding:11px 18px;border-radius:99px;border:1px solid rgba(245,240,232,.25);
  background:rgba(255,255,255,.06);color:#F5F0E8;cursor:pointer;
}
.pm-btn.primary{background:#E8A857;color:#0A0805;border-color:#E8A857;font-weight:600}

/* ── FILTER STRIP ── */
.filter-strip{
  display:flex;gap:8px;overflow-x:auto;padding:12px 14px;
  -webkit-overflow-scrolling:touch;scrollbar-width:none;background:#050403;flex-shrink:0;
}
.filter-strip::-webkit-scrollbar{display:none}
.filter-chip{
  flex-shrink:0;font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  color:rgba(245,240,232,.5);background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);
  padding:9px 15px;border-radius:99px;cursor:pointer;transition:all .18s;display:flex;align-items:center;gap:7px;
}
.filter-chip .fc-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.filter-chip.active{color:#0A0805;background:#E8A857;border-color:#E8A857}
.filter-chip.active .fc-dot{background:#0A0805 !important}

/* ── SHUTTER ROW ── */
.shutter-row{
  display:flex;align-items:center;justify-content:space-between;
  padding:6px 26px calc(env(safe-area-inset-bottom,0px) + 22px);background:#050403;flex-shrink:0;
}
.gallery-thumb-btn{
  width:46px;height:46px;border-radius:12px;overflow:hidden;
  border:1.5px solid rgba(245,240,232,.25);background:#171310 center/cover no-repeat;
  cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;color:rgba(245,240,232,.35);
}
.shutter-btn{
  width:72px;height:72px;border-radius:50%;border:3px solid #F5F0E8;background:transparent;
  display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;
}
.shutter-inner{width:58px;height:58px;border-radius:50%;background:#F5F0E8;transition:transform .12s}
.shutter-btn:active .shutter-inner{transform:scale(.82)}
.shutter-spacer{width:46px;height:46px}

/* ── GALLERY SCREEN ── */
.gallery-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:calc(env(safe-area-inset-top,0px) + 16px) 18px 14px;flex-shrink:0;
}
.gallery-header h1{font-size:19px;font-weight:600}
.gallery-count{font-family:'DM Mono',monospace;font-size:10px;color:rgba(245,240,232,.4);letter-spacing:.1em}
.gallery-grid{
  flex:1;overflow-y:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:2px;padding:0 0 20px;
}
.gallery-item{position:relative;aspect-ratio:1;overflow:hidden;background:#171310;cursor:pointer}
.gallery-item img{width:100%;height:100%;object-fit:cover;display:block}
.gallery-item .gi-tag{
  position:absolute;bottom:4px;left:4px;font-family:'DM Mono',monospace;font-size:7px;
  letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.85);
  background:rgba(0,0,0,.45);padding:2px 5px;border-radius:4px;
}
.gallery-empty{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  padding:40px;text-align:center;color:rgba(245,240,232,.4);
}
.gallery-empty .ge-icon{font-size:34px}
.gallery-empty .ge-text{font-size:13px;font-weight:400;line-height:1.6}

/* ── VIEWER ── */
.viewer{
  position:fixed;inset:0;z-index:50;background:rgba(3,2,2,.97);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
}
.viewer img{max-width:100%;max-height:78vh;object-fit:contain;border-radius:4px}
.viewer-top{position:absolute;top:calc(env(safe-area-inset-top,0px) + 14px);right:16px}
.viewer-controls{
  position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 26px);
  display:flex;gap:14px;
}
.vc-btn{
  font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  padding:12px 20px;border-radius:99px;border:1px solid rgba(245,240,232,.25);
  background:rgba(255,255,255,.06);color:#F5F0E8;cursor:pointer;display:flex;align-items:center;gap:6px;
}
.vc-btn.danger{border-color:rgba(196,90,90,.4);color:#E39A9A;background:rgba(196,90,90,.1)}
</style>
</head>
<body>

<div id="app">

  <!-- ═══ CAMERA SCREEN ═══ -->
  <section class="screen active" data-screen="camera">
    <div class="viewfinder" id="viewfinder">
      <canvas id="canvas"></canvas>
      <video id="video" playsinline muted autoplay></video>
      <div class="flash-layer" id="flashLayer"></div>

      <div class="top-controls">
        <div class="tc-group">
          <button class="icon-btn" id="btnFlash" title="Flash">⚡</button>
          <button class="icon-btn" id="btnImport" title="Importar foto">🖼️</button>
        </div>
        <div class="filter-name-badge" id="filterNameBadge">ORIGINAL</div>
        <div class="tc-group">
          <button class="icon-btn" id="btnSwitchCam" title="Cambiar cámara">⟲</button>
        </div>
      </div>

      <div class="import-badge hidden" id="importBadge">
        <div class="import-badge-inner">
          <span>Modo importar</span>
          <button id="btnExitImport">✕</button>
        </div>
      </div>

      <div class="permission-msg hidden" id="permissionMsg">
        <div class="pm-icon">📷</div>
        <div class="pm-title">No hay acceso a la cámara</div>
        <div class="pm-text" id="permissionMsgText">Activa el permiso de cámara en tu navegador para usar el visor en vivo. También puedes importar una foto de tu galería y aplicarle los filtros.</div>
        <div class="pm-actions">
          <button class="pm-btn primary" id="btnRetryCam">Reintentar</button>
          <button class="pm-btn" id="btnImportFallback">Importar foto</button>
        </div>
      </div>
    </div>

    <div class="filter-strip" id="filterStrip"></div>

    <div class="shutter-row">
      <button class="gallery-thumb-btn" id="btnGalleryThumb">🎞️</button>
      <button class="shutter-btn" id="btnShutter"><span class="shutter-inner"></span></button>
      <div class="shutter-spacer"></div>
    </div>
  </section>

  <!-- ═══ GALLERY SCREEN ═══ -->
  <section class="screen" data-screen="gallery">
    <div class="gallery-header">
      <div>
        <h1>Galería</h1>
        <div class="gallery-count" id="galleryCount">0 fotos</div>
      </div>
      <button class="icon-btn" id="btnCloseGallery">✕</button>
    </div>
    <div class="gallery-grid" id="galleryGrid"></div>
    <div class="gallery-empty hidden" id="galleryEmpty">
      <div class="ge-icon">📸</div>
      <div class="ge-text">Aún no has capturado ningún recuerdo.<br>Pulsa el disparador para empezar.</div>
    </div>
  </section>

  <!-- ═══ FULLSCREEN VIEWER ═══ -->
  <div class="viewer hidden" id="viewer">
    <button class="icon-btn viewer-top" id="btnViewerClose">✕</button>
    <img id="viewerImg" src="" alt="Foto">
    <div class="viewer-controls">
      <button class="vc-btn" id="btnViewerDownload">⬇ Descargar</button>
      <button class="vc-btn danger" id="btnViewerDelete">🗑 Eliminar</button>
    </div>
  </div>

  <input type="file" accept="image/*" id="fileInput" class="hidden">
</div>

<script>
(function(){
'use strict';

/* ── FILTER PRESETS ─────────────────────────────────────── */
const FILTERS = [
  { id:'original',  name:'ORIGINAL',     css:'none',                                                          grain:.06, vignette:.12, leak:null,    scanlines:false, fade:0,   dot:'#F5F0E8' },
  { id:'disposable',name:'DISPOSABLE',   css:'contrast(1.1) saturate(1.3) brightness(1.05) sepia(.15)',       grain:.35, vignette:.45, leak:'warm',  scanlines:false, fade:.05, dot:'#E8A857' },
  { id:'y2k',       name:'Y2K CAM',      css:'saturate(1.5) contrast(1.15) brightness(1.08) hue-rotate(-5deg)', grain:.22, vignette:.25, leak:null,  scanlines:false, fade:0,   dot:'#C4785A' },
  { id:'film90',    name:'90S FILM',     css:'sepia(.25) contrast(1.05) saturate(.9) brightness(.98)',        grain:.3,  vignette:.35, leak:'gold',  scanlines:false, fade:.1,  dot:'#C9A15A' },
  { id:'vhs',       name:'VHS',         css:'saturate(1.2) contrast(.95) brightness(1.02) hue-rotate(3deg)',  grain:.25, vignette:.2,  leak:null,    scanlines:true,  fade:0,   dot:'#7A9BB5' },
  { id:'polaroid',  name:'POLAROID',     css:'contrast(.95) saturate(.85) brightness(1.1) sepia(.1)',         grain:.15, vignette:.5,  leak:'white', scanlines:false, fade:.15, dot:'#F5F0E8' },
  { id:'noir',      name:'NOIR',         css:'grayscale(1) contrast(1.25) brightness(.95)',                   grain:.3,  vignette:.55, leak:null,    scanlines:false, fade:0,   dot:'#9A8A7A' },
  { id:'sepia',     name:'SEPIA DREAM',  css:'sepia(.6) contrast(1.05) saturate(.8) brightness(1.05)',        grain:.15, vignette:.4,  leak:'gold',  scanlines:false, fade:.08, dot:'#B08850' },
  { id:'faded',     name:'FADED',        css:'contrast(.85) saturate(.7) brightness(1.1)',                    grain:.1,  vignette:.2,  leak:null,    scanlines:false, fade:.25, dot:'#C4908A' },
  { id:'golden',    name:'GOLDEN HOUR',  css:'saturate(1.3) contrast(1.05) brightness(1.05) hue-rotate(-8deg) sepia(.1)', grain:.15, vignette:.35, leak:'warm', scanlines:false, fade:0, dot:'#E0A34A' },
  { id:'cyber',     name:'CYBER',        css:'saturate(1.6) contrast(1.2) hue-rotate(15deg) brightness(1.05)',grain:.2,  vignette:.3,  leak:'cyan',  scanlines:false, fade:0,   dot:'#78DCFF' }
];

/* ── DOM ─────────────────────────────────────────────────── */
const $ = id => document.getElementById(id);
const video = $('video'), canvas = $('canvas'), ctx = canvas.getContext('2d');
const viewfinder = $('viewfinder'), flashLayer = $('flashLayer');
const filterStrip = $('filterStrip'), filterNameBadge = $('filterNameBadge');
const permissionMsg = $('permissionMsg'), permissionMsgText = $('permissionMsgText');
const importBadge = $('importBadge'), fileInput = $('fileInput');
const galleryGrid = $('galleryGrid'), galleryEmpty = $('galleryEmpty'), galleryCount = $('galleryCount');
const viewer = $('viewer'), viewerImg = $('viewerImg');
const btnGalleryThumb = $('btnGalleryThumb'), btnFlash = $('btnFlash'), btnSwitchCam = $('btnSwitchCam');

/* ── STATE ───────────────────────────────────────────────── */
let stream = null, currentFacing = 'environment', torchOn = false;
let currentFilterIndex = 0, frameCount = 0, rafId = null, activeScreen = 'camera';
let sourceIsVideo = true, currentSource = video;
let overlays = {}, grainPattern = null, lastW = 0, lastH = 0, hasMultipleCams = false;
let viewerPhotoId = null, viewerObjectUrl = null;

const currentFilter = () => FILTERS[currentFilterIndex];

/* ── INDEXEDDB ───────────────────────────────────────────── */
const DB_NAME = 'vintagecam_db', DB_VERSION = 1, STORE = 'photos';
function dbOpen(){
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = () => {
      if(!req.result.objectStoreNames.contains(STORE)){
        req.result.createObjectStore(STORE, { keyPath:'id', autoIncrement:true });
      }
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function addPhoto(blob, filterName){
  const db = await dbOpen();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE, 'readwrite');
    tx.objectStore(STORE).add({ blob, filterName, ts: Date.now() });
    tx.oncomplete = resolve; tx.onerror = () => reject(tx.error);
  });
}
async function getAllPhotos(){
  const db = await dbOpen();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE, 'readonly');
    const req = tx.objectStore(STORE).getAll();
    req.onsuccess = () => resolve(req.result.sort((a, b) => b.id - a.id));
    req.onerror = () => reject(req.error);
  });
}
async function deletePhoto(id){
  const db = await dbOpen();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE, 'readwrite');
    tx.objectStore(STORE).delete(id);
    tx.oncomplete = resolve; tx.onerror = () => reject(tx.error);
  });
}

/* ── CAMERA ──────────────────────────────────────────────── */
async function startCamera(facing){
  stopStream();
  hidePermissionMsg();
  try{
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: facing }, width: { ideal: 1280 }, height: { ideal: 1280 } },
      audio: false
    });
    video.srcObject = stream;
    await video.play();
    currentFacing = facing;
    sourceIsVideo = true;
    currentSource = video;
    importBadge.classList.add('hidden');
    torchOn = false;
    btnFlash.classList.remove('active-state');
    resizeCanvas(true);
    if(activeScreen === 'camera' && !rafId) renderLoop();
  }catch(err){
    showPermissionMsg(err);
  }
}
function stopStream(){
  if(stream){ stream.getTracks().forEach(t => t.stop()); stream = null; }
}
async function detectMultipleCameras(){
  try{
    const devices = await navigator.mediaDevices.enumerateDevices();
    hasMultipleCams = devices.filter(d => d.kind === 'videoinput').length > 1;
    btnSwitchCam.style.display = hasMultipleCams ? '' : 'none';
  }catch(e){ /* enumerateDevices unsupported — keep default control visible */ }
}
function showPermissionMsg(err){
  let msg = 'Activa el permiso de cámara en tu navegador para usar el visor en vivo. También puedes importar una foto y aplicarle los filtros.';
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    msg = 'Este navegador no soporta acceso a la cámara. Puedes importar una foto de tu galería para probar los filtros.';
  } else if(err && err.name === 'NotAllowedError'){
    msg = 'Permiso de cámara denegado. Revisa los ajustes del sitio en tu navegador y vuelve a intentarlo.';
  } else if(err && err.name === 'NotFoundError'){
    msg = 'No se detectó ninguna cámara en este dispositivo.';
  } else if(location.protocol !== 'https:' && location.hostname !== 'localhost'){
    msg = 'La cámara requiere una conexión segura (HTTPS). Importa una foto mientras tanto.';
  }
  permissionMsgText.textContent = msg;
  permissionMsg.classList.remove('hidden');
}
function hidePermissionMsg(){ permissionMsg.classList.add('hidden'); }

/* ── CANVAS SIZING & OVERLAYS ────────────────────────────── */
function resizeCanvas(force){
  const rect = viewfinder.getBoundingClientRect();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = Math.round(rect.width * dpr), h = Math.round(rect.height * dpr);
  if(!force && w === lastW && h === lastH) return;
  if(w === 0 || h === 0) return;
  canvas.width = w; canvas.height = h;
  lastW = w; lastH = h;
  buildOverlays(w, h);
}
function buildOverlays(w, h){
  overlays.vignette = makeVignette(w, h);
  overlays.scanlines = makeScanlines(w, h);
  overlays.leaks = {
    warm:  makeLeak(w, h, 'rgba(255,170,80,.9)'),
    gold:  makeLeak(w, h, 'rgba(255,210,120,.85)'),
    white: makeLeak(w, h, 'rgba(255,255,255,.8)'),
    cyan:  makeLeak(w, h, 'rgba(120,220,255,.8)')
  };
  grainPattern = ctx.createPattern(makeGrainTile(), 'repeat');
}
function makeVignette(w, h){
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d');
  const grad = g.createRadialGradient(w/2, h/2, h*.35, w/2, h/2, h*.78);
  grad.addColorStop(0, 'rgba(0,0,0,0)'); grad.addColorStop(1, 'rgba(0,0,0,.92)');
  g.fillStyle = grad; g.fillRect(0, 0, w, h);
  return c;
}
function makeGrainTile(){
  const size = 160;
  const c = document.createElement('canvas'); c.width = size; c.height = size;
  const g = c.getContext('2d');
  const id = g.createImageData(size, size);
  for(let i = 0; i < id.data.length; i += 4){
    const v = (Math.random() * 255) | 0;
    id.data[i] = v; id.data[i+1] = v; id.data[i+2] = v; id.data[i+3] = 255;
  }
  g.putImageData(id, 0, 0);
  return c;
}
function makeScanlines(w, h){
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d');
  g.fillStyle = 'rgba(0,0,0,.5)';
  for(let y = 0; y < h; y += 4) g.fillRect(0, y, w, 1);
  return c;
}
function makeLeak(w, h, color){
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d');
  const grad = g.createRadialGradient(w*.85, h*.12, 0, w*.85, h*.12, h*.55);
  grad.addColorStop(0, color); grad.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = grad; g.fillRect(0, 0, w, h);
  return c;
}

/* ── RENDER LOOP ─────────────────────────────────────────── */
function drawFrame(time){
  const w = canvas.width, h = canvas.height;
  if(w === 0 || h === 0) return;
  const f = currentFilter();

  const sw = sourceIsVideo ? video.videoWidth : currentSource.naturalWidth;
  const sh = sourceIsVideo ? video.videoHeight : currentSource.naturalHeight;
  if(!sw || !sh) return;

  const canvasRatio = w / h, srcRatio = sw / sh;
  let sx, sy, sWidth, sHeight;
  if(srcRatio > canvasRatio){ sHeight = sh; sWidth = sh * canvasRatio; sx = (sw - sWidth) / 2; sy = 0; }
  else { sWidth = sw; sHeight = sw / canvasRatio; sx = 0; sy = (sh - sHeight) / 2; }

  ctx.save();
  ctx.filter = f.css;
  if(sourceIsVideo && currentFacing === 'user'){ ctx.translate(w, 0); ctx.scale(-1, 1); }
  ctx.drawImage(currentSource, sx, sy, sWidth, sHeight, 0, 0, w, h);
  ctx.restore();

  if(f.fade > 0){
    ctx.save(); ctx.globalAlpha = f.fade; ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h); ctx.restore();
  }
  if(f.vignette > 0){
    ctx.save(); ctx.globalAlpha = f.vignette; ctx.globalCompositeOperation = 'multiply';
    ctx.drawImage(overlays.vignette, 0, 0); ctx.restore();
  }
  if(f.leak){
    const t = time * 0.00006;
    const dx = Math.sin(t) * w * 0.05, dy = Math.cos(t * 0.8) * h * 0.03;
    ctx.save(); ctx.globalAlpha = .55; ctx.globalCompositeOperation = 'screen';
    ctx.drawImage(overlays.leaks[f.leak], dx, dy); ctx.restore();
  }
  if(f.scanlines){
    ctx.save(); ctx.globalAlpha = .5; ctx.globalCompositeOperation = 'multiply';
    ctx.drawImage(overlays.scanlines, 0, 0); ctx.restore();
    if(frameCount % 14 === 0){
      ctx.save(); ctx.globalAlpha = .15; ctx.fillStyle = '#fff';
      ctx.fillRect(0, Math.random() * h, w, 2 + Math.random() * 3); ctx.restore();
    }
  }
  if(f.grain > 0 && grainPattern){
    ctx.save();
    ctx.globalAlpha = f.grain; ctx.globalCompositeOperation = 'overlay';
    ctx.translate((frameCount * 3) % 160, (frameCount * 5) % 160);
    ctx.fillStyle = grainPattern;
    ctx.fillRect(-160, -160, w + 320, h + 320);
    ctx.restore();
  }
  frameCount++;
}
function renderLoop(time){
  rafId = requestAnimationFrame(renderLoop);
  resizeCanvas(false);
  if(sourceIsVideo && video.readyState < 2) return;
  drawFrame(time || 0);
}
function stopRenderLoop(){ if(rafId){ cancelAnimationFrame(rafId); rafId = null; } }

/* ── CAPTURE ─────────────────────────────────────────────── */
function flashPulse(){
  flashLayer.classList.remove('fade'); flashLayer.classList.add('pop');
  requestAnimationFrame(() => {
    setTimeout(() => { flashLayer.classList.remove('pop'); flashLayer.classList.add('fade'); }, 70);
  });
}
function capturePhoto(){
  if(canvas.width === 0) return;
  flashPulse();
  canvas.toBlob(blob => {
    if(!blob) return;
    addPhoto(blob, currentFilter().name).then(refreshGalleryThumb);
  }, 'image/jpeg', 0.92);
}

/* ── FILTER STRIP UI ─────────────────────────────────────── */
function buildFilterStrip(){
  FILTERS.forEach((f, i) => {
    const btn = document.createElement('button');
    btn.className = 'filter-chip' + (i === 0 ? ' active' : '');
    btn.innerHTML = '<span class="fc-dot" style="background:' + f.dot + '"></span>' + f.name;
    btn.addEventListener('click', () => selectFilter(i));
    filterStrip.appendChild(btn);
  });
}
function selectFilter(i){
  currentFilterIndex = i;
  Array.from(filterStrip.children).forEach((el, idx) => el.classList.toggle('active', idx === i));
  filterNameBadge.textContent = FILTERS[i].name;
  filterStrip.children[i].scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
}

/* ── SCREEN NAVIGATION ───────────────────────────────────── */
function showScreen(name){
  activeScreen = name;
  document.querySelectorAll('.screen').forEach(s => s.classList.toggle('active', s.dataset.screen === name));
  if(name === 'camera'){ if(!rafId) renderLoop(); }
  else { stopRenderLoop(); }
}
function openGallery(){ showScreen('gallery'); loadGallery(); }
function closeGallery(){ showScreen('camera'); }

/* ── GALLERY ─────────────────────────────────────────────── */
async function loadGallery(){
  const photos = await getAllPhotos();
  galleryGrid.innerHTML = '';
  galleryCount.textContent = photos.length + (photos.length === 1 ? ' foto' : ' fotos');
  galleryEmpty.classList.toggle('hidden', photos.length > 0);
  photos.forEach(p => {
    const url = URL.createObjectURL(p.blob);
    const item = document.createElement('div');
    item.className = 'gallery-item';
    item.innerHTML = '<img src="' + url + '" loading="lazy"><span class="gi-tag">' + p.filterName + '</span>';
    item.addEventListener('click', () => openViewer(p, url));
    galleryGrid.appendChild(item);
  });
}
async function refreshGalleryThumb(){
  const photos = await getAllPhotos();
  if(photos.length){
    const url = URL.createObjectURL(photos[0].blob);
    btnGalleryThumb.style.backgroundImage = 'url(' + url + ')';
    btnGalleryThumb.textContent = '';
  } else {
    btnGalleryThumb.style.backgroundImage = '';
    btnGalleryThumb.textContent = '🎞️';
  }
}

/* ── VIEWER ──────────────────────────────────────────────── */
function openViewer(photo, url){
  viewerPhotoId = photo.id;
  viewerObjectUrl = url;
  viewerImg.src = url;
  viewer.classList.remove('hidden');
}
function closeViewer(){
  viewer.classList.add('hidden');
  viewerPhotoId = null;
}
async function deleteViewerPhoto(){
  if(viewerPhotoId == null) return;
  await deletePhoto(viewerPhotoId);
  closeViewer();
  loadGallery();
  refreshGalleryThumb();
}
function downloadViewerPhoto(){
  if(!viewerObjectUrl) return;
  const a = document.createElement('a');
  a.href = viewerObjectUrl;
  a.download = 'vintagecam_' + Date.now() + '.jpg';
  document.body.appendChild(a); a.click(); a.remove();
}

/* ── IMPORT FROM DEVICE ──────────────────────────────────── */
function handleImportFile(file){
  if(!file) return;
  const img = new Image();
  img.onload = () => {
    sourceIsVideo = false;
    currentSource = img;
    importBadge.classList.remove('hidden');
    hidePermissionMsg();
    if(activeScreen === 'camera' && !rafId) renderLoop();
  };
  img.src = URL.createObjectURL(file);
}
function exitImportMode(){
  importBadge.classList.add('hidden');
  if(stream){ sourceIsVideo = true; currentSource = video; }
  else { startCamera(currentFacing); }
}

/* ── EVENTS ──────────────────────────────────────────────── */
function wireEvents(){
  $('btnShutter').addEventListener('click', capturePhoto);
  $('btnGalleryThumb').addEventListener('click', openGallery);
  $('btnCloseGallery').addEventListener('click', closeGallery);
  $('btnSwitchCam').addEventListener('click', () => startCamera(currentFacing === 'user' ? 'environment' : 'user'));
  $('btnRetryCam').addEventListener('click', () => startCamera(currentFacing));
  $('btnImport').addEventListener('click', () => fileInput.click());
  $('btnImportFallback').addEventListener('click', () => fileInput.click());
  $('btnExitImport').addEventListener('click', exitImportMode);
  fileInput.addEventListener('change', e => handleImportFile(e.target.files[0]));

  $('btnFlash').addEventListener('click', async () => {
    if(!stream) return;
    const track = stream.getVideoTracks()[0];
    const caps = track.getCapabilities ? track.getCapabilities() : {};
    if(caps.torch){
      torchOn = !torchOn;
      try{
        await track.applyConstraints({ advanced: [{ torch: torchOn }] });
        btnFlash.classList.toggle('active-state', torchOn);
      }catch(e){ torchOn = false; }
    } else {
      btnFlash.classList.add('shake');
      setTimeout(() => btnFlash.classList.remove('shake'), 350);
    }
  });

  $('btnViewerClose').addEventListener('click', closeViewer);
  $('btnViewerDelete').addEventListener('click', deleteViewerPhoto);
  $('btnViewerDownload').addEventListener('click', downloadViewerPhoto);

  window.addEventListener('resize', () => resizeCanvas(false));
  document.addEventListener('visibilitychange', () => {
    if(document.hidden){ stopRenderLoop(); }
    else if(activeScreen === 'camera'){ renderLoop(); }
  });
}

/* ── INIT ────────────────────────────────────────────────── */
async function init(){
  buildFilterStrip();
  wireEvents();
  await detectMultipleCameras();
  await startCamera(currentFacing);
  refreshGalleryThumb();
}
document.addEventListener('DOMContentLoaded', init);

})();
</script>
